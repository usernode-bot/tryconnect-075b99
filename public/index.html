  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };

        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });

      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);

    });

  })();

       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">

  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();

  <!-- /usernode-spec-screens@1 -->

  <script>
  (function () {
    'use strict';

    // ── The page's own data ──────────────────────────────────────────────
    var isDemo = new URLSearchParams(location.search).get('demo') === '1';
    var API = '/api/zones' + (isDemo ? '?demo=1' : '');
    var CATEGORIES = { makanan: 'Makanan', ojek: 'Ojek', jualan: 'Jualan', jasa: 'Jasa' };
    var FILTERS = ['all', 'makanan', 'ojek', 'jualan', 'jasa'];
    var zones = [];
    var origin = null;          // the viewer's position {lat,lng}, or demoOrigin in the demo
    var filter = 'all';
    var token = new URLSearchParams(location.search).get('token') || '';

    function $(id) { return document.getElementById(id); }
    function api(path, opts) {
      opts = opts || {};
      opts.headers = Object.assign({ 'x-usernode-token': token, 'Content-Type': 'application/json' }, opts.headers || {});
      return fetch(path, opts);
    }

    // ── Distance and time, in Indonesian ────────────────────────────────
    function distanceKm(a, b) {
      var R = 6371, rad = Math.PI / 180;
      var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
      var h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    function fmtDist(km) {
      if (km < 1) return Math.round(km * 1000) + ' m';
      var s = km < 10 ? km.toFixed(1).replace('.', ',') : Math.round(km).toString();
      return s + ' km';
    }
    function fmtWhen(iso) {
      var d = new Date(iso), n = Date.now();
      var mins = Math.max(0, Math.round((n - d.getTime()) / 60000));
      if (mins < 1) return 'baru saja';
      if (mins < 60) return mins + ' menit lalu';
      var hrs = Math.round(mins / 60);
      if (hrs < 24) return hrs + ' jam lalu';
      var days = Math.round(hrs / 24);
      if (days < 30) return days + ' hari lalu';
      return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // ── Sorting and rendering ───────────────────────────────────────────
    // Distances read off `origin`, which is the demo's stand-in until a
    // real position is read. Zones without coordinates go last, newest
    // first. Without any position the whole list is newest first.
    function sorted() {
      var list = zones.slice();
      if (filter !== 'all') list = list.filter(function (z) { return z.category === filter; });
      if (!origin) return list;
      var withPos = [], without = [];
      list.forEach(function (z) {
        (z.lat != null && z.lng != null ? withPos : without).push(z);
      });
      withPos.sort(function (a, b) {
        return distanceKm(origin, a) - distanceKm(origin, b) || new Date(b.created_at) - new Date(a.created_at);
      });
      without.sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      return withPos.concat(without);
    }

    function badgeCat(cat) { return CATEGORIES[cat] || cat; }

    function renderList() {
      var list = sorted();
      var listEl = $('zone-list');
      listEl.textContent = '';
      var noPosShown = false;
      var tpl = $('zone-row');
      list.forEach(function (z) {
        if (origin && z.lat == null && z.lng == null && !noPosShown) {
          // Zones saved without a location come last, under their own label.
          var head = document.createElement('p');
          head.className = 'section-label noloc-head';
          head.textContent = 'Tanpa lokasi';
          listEl.appendChild(head);
          noPosShown = true;
        }
        var row = tpl.content.firstElementChild.cloneNode(true);
        row.dataset.zoneId = z.id;
        row.querySelector('.zn').textContent = z.name;
        row.querySelector('.dist').textContent =
          (z.lat != null && z.lng != null && origin) ? fmtDist(distanceKm(origin, z)) : '';
        row.querySelector('.note').textContent = z.note || '';
        var badge = row.querySelector('.badge');
        badge.textContent = badgeCat(z.category);
        badge.classList.add(z.category);
        row.querySelector('.by').textContent = z.mine ? 'Ditambah kamu' : 'Ditambah ' + z.author_username;
        row.addEventListener('click', function () { openDetail(z); });
        listEl.appendChild(row);
      });

      // One count line: "12 zona peluang cuan, paling dekat dulu" — the
      // drawn value, emptied here and set from the data.
      var n = zones.length;
      $('count-line').textContent = n === 0 ? 'Zona peluang cuan'
        : n + ' zona peluang cuan, ' + (origin ? 'paling dekat dulu' : 'terbaru dulu');

      // The section label names the list; the demo words are marked so
      // Homeroom can hide them where the demo is labelled its own way.
      var label = $('section-label');
      label.textContent = '';
      if (origin) {
        label.append('Dekat kamu');
      } else {
        label.append('Terbaru');
      }
      if (isDemo) {
        var d = document.createElement('span');
        d.setAttribute('data-usernode-demo-note', '');
        d.textContent = ' · Staging demo';
        label.appendChild(d);
      }

      // The location line: an offer to sort, or the fallback's explanation.
      // Not shown over an empty list, where there is nothing to sort.
      var locLine = $('loc-line');
      var locText = $('loc-text');
      var locBtn = $('loc-btn');
      if (zones.length === 0) {
        locLine.hidden = true;
        label.textContent = '';
      } else if (origin && !usingDemoOrigin) {
        locLine.hidden = true;
      } else if (origin && usingDemoOrigin) {
        locText.textContent = 'Urutan memakai titik demo.';
        locBtn.hidden = false; locBtn.textContent = 'Pakai lokasi saya';
        locLine.hidden = false;
      } else {
        locText.textContent = 'Urutkan dari yang paling dekat';
        locBtn.hidden = false; locBtn.textContent = 'Pakai lokasi saya';
        locLine.hidden = false;
      }

      // The four states, exactly one at a time.
      var noFilterHit = list.length === 0 && zones.length > 0;
      $('state-loading').hidden = true;
      $('state-empty').hidden = !(zones.length === 0 && loaded);
      $('state-error').hidden = !loadFailed;
      $('state-filter-empty').hidden = !noFilterHit;
      $('zone-list').hidden = list.length === 0;
      if (noFilterHit) $('filter-name').textContent = badgeCat(filter);
      // The screen's one primary button: hidden when the empty state's
      // own button is on the page, which is the only filled one then.
      $('add-fab').hidden = zones.length === 0 && loaded || loadFailed;
      $('add-fab').style.display = $('add-fab').hidden ? 'none' : '';
    }

    var loaded = false, loadFailed = false, usingDemoOrigin = false;
    function load() {
      loadFailed = false;
      loaded = false;
      $('state-loading').hidden = false;
      $('state-empty').hidden = true;
      $('state-error').hidden = true;
      $('state-filter-empty').hidden = true;
      $('zone-list').hidden = true;
      $('add-fab').style.display = 'none';
      api(API).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (data) {
        zones = data.zones || [];
        if (data.demoOrigin) { origin = data.demoOrigin; usingDemoOrigin = true; }
        loaded = true;
        renderList();
      }).catch(function () {
        loadFailed = true;
        loaded = false;
        renderList();
      });
    }

    // ── Location permission, through the bridge ─────────────────────────
    // Never asked at startup: the app only reads the position after a tap
    // on "Pakai lokasi saya". `active: false` means granted and the frame
    // is about to reload — stop and let it land.
    function askLocation(after) {
      var un = window.usernode;
      if (!un || !un.requestPermission) { after(null); return; }
      un.requestPermission('geolocation').then(function (r) {
        if (r.state !== 'granted' || r.active === false) { after(null); return; }
        navigator.geolocation.getCurrentPosition(
          function (pos) { after({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
          function () { after(null); },
          { timeout: 10000, maximumAge: 60000 });
      }).catch(function () { after(null); });
    }

    function useMyLocation() {
      var btn = $('loc-btn');
      btn.textContent = 'Memuat…';
      askLocation(function (pos) {
        btn.textContent = 'Pakai lokasi saya';
        if (pos) {
          origin = pos; usingDemoOrigin = false; knownOrigin = pos;
          renderList();
        } else {
          origin = null; usingDemoOrigin = false;
          renderList();
        }
      });
    }

    // ── The add sheet ───────────────────────────────────────────────────
    var chosenCat = null, chosenPos = null;
    // A visitor with no account is asked to make one when they tap
    // Tambah zona, before the sheet opens. The probe is an empty POST: a
    // signed-in person gets the validation answer (400), a guest gets 401
    // account_required, and nothing is written either way.
    function openAdd() {
      api('/api/zones' + (isDemo ? '?demo=1' : ''), { method: 'POST', body: '{}' }).then(function (r) {
        if (r.status === 401) {
          if (window.usernode && window.usernode.askForAccount) window.usernode.askForAccount({ action: 'tambah zona' });
          return;
        }
        openAddSheet();
      }).catch(function () {});
    }
    function openAddSheet() {
      chosenCat = null; chosenPos = null;
      $('f-name').value = ''; $('f-note').value = ''; $('note-count').textContent = '0/140';
      $('f-loc-hint').textContent = 'Zona ditandai di tempat kamu berdiri sekarang.';
      $('f-loc-btn').textContent = 'Pakai lokasi saya sekarang';
      $('add-err').hidden = true;
      var chips = $('cat-chips').querySelectorAll('.chip');
      chips.forEach(function (c) { c.classList.remove('on'); });
      $('add-sheet').hidden = false;
      $('add-fab').style.display = 'none';
      $('f-name').focus();
    }
    function closeAdd() { $('add-sheet').hidden = true; renderList(); }

    $('cat-chips').addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip) return;
      chosenCat = chip.dataset.cat;
      $('cat-chips').querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c === chip); });
    });
    $('f-note').addEventListener('input', function () {
      var n = $('f-note').value.length;
      $('note-count').textContent = n + '/140';
    });
    $('f-loc-btn').addEventListener('click', function () {
      var b = $('f-loc-btn');
      b.textContent = 'Memuat…';
      askLocation(function (pos) {
        chosenPos = pos;
        if (pos) {
          b.textContent = 'Lokasi siap';
          $('f-loc-hint').textContent = 'Zona ditandai di tempat kamu berdiri sekarang.';
        } else {
          b.textContent = 'Coba lagi';
          $('f-loc-hint').textContent = 'Lokasi tidak tersedia, zona disimpan tanpa jarak.';
        }
      });
    });
    $('add-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = $('f-name').value.trim();
      var note = $('f-note').value.trim();
      var err = $('add-err');
      err.hidden = true;
      if (!name) { err.textContent = 'Nama zona wajib diisi.'; err.hidden = false; return; }
      if (!chosenCat) { err.textContent = 'Pilih salah satu jenis cuan.'; err.hidden = false; return; }
      var body = { name: name, category: chosenCat, note: note };
      if (chosenPos) { body.lat = chosenPos.lat; body.lng = chosenPos.lng; }
      $('add-save').disabled = true;
      $('add-save').textContent = 'Menyimpan…';
      api(API, { method: 'POST', body: JSON.stringify(body) }).then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error(data.error || 'Gagal menyimpan zona.');
          return data;
        });
      }).then(function (data) {
        zones.push(data.zone);
        closeAdd();
        if (data.zone.lat != null && data.zone.lng != null && !origin) origin = null;
        renderList();
      }).catch(function (ex) {
        // The sheet stays open, everything typed stays, a short message shows.
        err.textContent = ex.message || 'Gagal menyimpan zona. Coba lagi.';
        err.hidden = false;
      }).then(function () {
        $('add-save').disabled = false;
        $('add-save').textContent = 'Simpan zona';
      });
    });

    // ── The detail sheet ────────────────────────────────────────────────
    var openZone = null;
    function openDetail(z) {
      openZone = z;
      $('d-badge').textContent = badgeCat(z.category);
      $('d-badge').className = 'badge ' + z.category;
      $('d-name').textContent = z.name;
      $('d-note').textContent = z.note || '';
      var meta = badgeCat(z.category) + ' · Ditambah ' + (z.mine ? 'kamu' : z.author_username) + ' · ' + fmtWhen(z.created_at);
      if (z.lat != null && z.lng != null && origin) meta = fmtDist(distanceKm(origin, z)) + ' · ' + meta;
      $('d-meta').textContent = meta;
      var map = $('d-map');
      if (z.lat != null && z.lng != null) {
        map.hidden = false;
        map.href = 'https://www.google.com/maps?q=' + z.lat + ',' + z.lng;
      } else {
        map.hidden = true;
      }
      // The server's `mine` flag decides which of the two actions shows.
      $('d-delete').hidden = !z.mine;
      $('d-report').hidden = !!z.mine;
      $('d-msg').hidden = true;
      $('detail-sheet').hidden = false;
    }
    $('d-delete').addEventListener('click', function () {
      if (!openZone) return;
      if (!window.confirm('Hapus zona ini?')) return;
      api('/api/zones/' + openZone.id, { method: 'DELETE', headers: { 'x-usernode-token': token } }).then(function (r) {
        if (!r.ok) return;
        zones = zones.filter(function (z) { return z.id !== openZone.id; });
        openZone = null;
        $('detail-sheet').hidden = true;
        renderList();
      });
    });
    $('d-report').addEventListener('click', function () {
      if (!openZone) return;
      api('/api/zones/' + openZone.id + '/report', { method: 'POST', headers: { 'x-usernode-token': token }, body: '{}' }).then(function (r) {
        $('d-msg').hidden = false;
        $('d-msg').textContent = r.ok ? 'Laporan terkirim' : 'Laporan gagal dikirim.';
        if (r.ok) $('d-report').hidden = true;
      });
    });

    // ── Wiring ──────────────────────────────────────────────────────────
    $('chips').addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip) return;
      filter = chip.dataset.filter;
      $('chips').querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c === chip); });
      renderList();
    });
    $('see-all-btn').addEventListener('click', function () {
      filter = 'all';
      $('chips').querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c.dataset.filter === 'all'); });
      renderList();
    });
    $('loc-btn').addEventListener('click', useMyLocation);
    $('add-fab').addEventListener('click', openAdd);
    document.querySelector('.empty-add').addEventListener('click', openAdd);
    $('retry-btn').addEventListener('click', load);
    $('add-cancel').addEventListener('click', closeAdd);
    $('detail-close').addEventListener('click', function () { $('detail-sheet').hidden = true; openZone = null; });
    // A tap on the dimmed backdrop closes the sheet it belongs to.
    document.querySelectorAll('.sheet-back').forEach(function (back) {
      back.addEventListener('click', function (e) {
        if (e.target !== back) return;
        back.hidden = true;
        if (back.id === 'detail-sheet') openZone = null;
        renderList();
      });
    });

    // A location permission already granted reads its position straight
    // away, so the list can be nearest-first without another tap.
    if (window.usernode && window.usernode.getPermission) {
      window.usernode.getPermission('geolocation').then(function (r) {
        if (r && r.state === 'granted' && r.active) {
          navigator.geolocation.getCurrentPosition(function (pos) {
            origin = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            usingDemoOrigin = false;
            renderList();
          }, function () {}, { timeout: 10000, maximumAge: 60000 });
        }
      }).catch(function () {});
    }

    load();
  })();
  </script>
</body>
</html>
